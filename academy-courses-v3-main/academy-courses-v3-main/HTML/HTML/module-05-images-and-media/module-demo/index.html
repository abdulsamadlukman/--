<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chidinma Portraits</title>
</head>
<body>
    <img src="logo.png" alt="Chidinma Portraits logo — a purple triangle with the letters CP" width="150" height="150">

    <h1>Chidinma Portraits</h1>

    <p>Portrait photography for families, graduations, and weddings, based in Owerri.</p>

    <img src="camera-icon.svg" alt="" width="32" height="32">
    <img src="camera-icon.svg" alt="A camera icon, shown much larger" width="200" height="200">

    <h2>A Recent Shoot</h2>

    <img src="studio-photo.jpg" alt="A colourful abstract preview of a recent portrait session" width="500" height="313">

    <img src="missing-photo.jpg" alt="Behind the scenes from our last shoot — coming soon">

    <h2>Studio Sounds</h2>

    <audio controls>
        <source src="shutter-sound.ogg" type="audio/ogg">
        <source src="shutter-sound.wav" type="audio/wav">
        Your browser does not support audio playback.
    </audio>

    <h2>Studio Reel</h2>

    <video controls width="320" height="240" poster="reel-poster.png" loop>
        <source src="studio-reel.mp4" type="video/mp4">
        <source src="studio-reel.webm" type="video/webm">
        Your browser does not support video playback.
    </video>

    <h2>Find the Studio</h2>

    <iframe
        src="https://www.google.com/maps/embed?origin=mfe&amp;pb=!1m2!2m1!1sOwerri,Nigeria"
        width="500"
        height="350"
        loading="lazy"
        title="Map showing the studio location">
    </iframe>
</body>
</html>
