<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adaeze Events — RSVP</title>
</head>
<body>
    <h1>RSVP for the Launch Party</h1>

    <form action="#" method="POST">
        <label for="guestname">Full Name:</label>
        <input type="text" id="guestname" name="guestname" required minlength="3" maxlength="50" pattern="[A-Za-z ]{3,}" placeholder="Enter your full name">

        <label>
            Email Address:
            <input type="email" name="email" required>
        </label>

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" required min="1" max="6">

        <fieldset>
            <legend>Meal Preference:</legend>
            <label>
                <input type="checkbox" name="meal" value="jollof"> Jollof Rice
            </label>
            <label>
                <input type="checkbox" name="meal" value="pounded-yam"> Pounded Yam &amp; Egusi
            </label>
            <label>
                <input type="checkbox" name="meal" value="vegetarian"> Vegetarian Option
            </label>
        </fieldset>

        <fieldset>
            <legend>Will you attend?</legend>
            <label>
                <input type="radio" name="attending" value="yes" required> Yes, I'll be there
            </label>
            <label>
                <input type="radio" name="attending" value="no" required> Sorry, can't make it
            </label>
        </fieldset>

        <label for="city">Travelling From:</label>
        <select id="city" name="city">
            <option value="">-- Select --</option>
            <option value="lagos">Lagos</option>
            <option value="abuja">Abuja</option>
            <option value="ibadan">Ibadan</option>
            <option value="portharcourt">Port Harcourt</option>
            <option value="kano">Kano</option>
            <option value="other">Other</option>
        </select>

        <label for="notes">Anything else we should know?</label>
        <textarea id="notes" name="notes" rows="4" placeholder="Dietary restrictions, accessibility needs, etc."></textarea>

        <button type="submit">Send RSVP</button>
    </form>
</body>
</html>
